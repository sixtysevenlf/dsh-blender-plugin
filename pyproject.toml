# Python tooling configuration for the Blender add-on and its tests.
#
# This project ships as an npm package, so there is no Python build; this file is
# intentionally only a single home for pytest, Ruff, and import-linter configuration.

[tool.pytest.ini_options]
testpaths = ["tests/unit/python", "tests/integration/python"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = '-q --import-mode=importlib -p no:cacheprovider -m "not blender and not gui"'
markers = [
  "blender: requires a real Blender executable (headless E2E)",
  "gui: requires Xvfb/desktop Blender and the addon GUI channel",
]

[tool.ruff]
# Python static quality gate for the add-on, runtime Python and tests. Every
# violation fails `npm run check:python-static`; there is no checked-in
# baseline. Broad style rules are deliberately not enabled here: formatting is
# a separate concern.
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E9", "F63", "F7", "F82", "F401", "F811", "F821", "F823"]

[tool.importlinter]
# Python import boundaries are enforced by scripts/check-python-imports.mjs.
# New domains under runtime/py must be listed in the layers contract or the
# exhaustive check fails; there are no per-file waivers.
root_packages = ["runtime.py", "dsh_blender_bridge"]
include_external_packages = true

[[tool.importlinter.contracts]]
name = "runtime domains are independent"
type = "layers"
containers = ["runtime.py"]
layers = ["core | geometry | assembly | render | export | animation"]
exhaustive = true
# _facade resolves its targets dynamically, so the static graph cannot see them.
exhaustive_ignores = ["_facade"]

[[tool.importlinter.contracts]]
name = "addon assets must not import commands"
type = "forbidden"
source_modules = ["dsh_blender_bridge.assets.io"]
forbidden_modules = ["dsh_blender_bridge.commands"]

[[tool.importlinter.contracts]]
name = "addon ui panels must not import integrations"
type = "forbidden"
source_modules = ["dsh_blender_bridge.ui.panels"]
forbidden_modules = ["dsh_blender_bridge.integrations"]
allow_indirect_imports = true
