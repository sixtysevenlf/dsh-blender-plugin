name: E2E (Blender)

on:
  workflow_dispatch:
  pull_request:
    types: [labeled]
  push:
    tags: ["v*"]

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  blender-headless:
    name: Blender 4.2 headless E2E
    if: github.event_name != 'pull_request' || github.event.label.name == 'run-e2e'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      PYTHONIOENCODING: utf-8
      PYTHONUTF8: "1"
      BLENDER_VERSION: "4.2.10"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.17.0"
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: |
          npm ci --legacy-peer-deps
          python -m pip install -r requirements-dev.txt
      - name: Install Blender
        run: |
          curl -fsSL -o blender.tar.xz "https://download.blender.org/release/Blender4.2/blender-${BLENDER_VERSION}-linux-x64.tar.xz"
          tar -xf blender.tar.xz
          echo "$PWD/blender-${BLENDER_VERSION}-linux-x64" >> "$GITHUB_PATH"
      - name: Blender version
        run: blender --version
      - name: Addon zip build check
        run: npm run check:addon
      - name: E2E (headless)
        env:
          PYTHON: python
          DSH_BLENDER_EXE: blender
          TMPDIR: ${{ runner.temp }}
        run: npm run test:e2e
      - name: E2E (GUI/Xvfb)
        if: runner.os == 'Linux'
        env:
          PYTHON: python
          DSH_BLENDER_EXE: blender
          TMPDIR: ${{ runner.temp }}
        run: |
          sudo apt-get update && sudo apt-get install -y xvfb libegl1 libgl1 libxkbcommon0 libfontconfig1
          xvfb-run -a npm run test:e2e:gui
      - name: Upload E2E logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-logs
          path: tmp/e2e
          if-no-files-found: ignore
