name: PR gate

on:
  pull_request:
  push:
    branches: [refactor, main]

concurrency:
  group: pr-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  static-and-tests:
    name: Static checks and PR tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PYTHONIOENCODING: utf-8
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.17.0'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install dependencies
        run: |
          npm ci --legacy-peer-deps
          python -m pip install -r requirements-dev.txt -r requirements-typecheck.txt
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Format check
        run: npm run format:check
      - name: Structure and build checks
        run: |
          npm run check:structure
          npm run check:build
      - name: Unit and integration tests
        run: |
          npm run test:unit
          npm run test:integration
          npm run test:contract
      - name: Python tests (no Blender)
        env:
          PYTHON: python
          TMPDIR: ${{ runner.temp }}
        run: npm run test:python
      - name: Behavior matrix release gate
        run: npm run test:matrix
      - name: Package dry run
        run: npm pack --dry-run

  addon:
    name: Blender addon unit tests and typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONIOENCODING: utf-8
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.17.0'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Create Python venv
        run: python -m venv .venv
      - name: Install dependencies
        run: |
          npm ci --legacy-peer-deps
          .venv/bin/python -m pip install -r requirements-dev.txt -r requirements-typecheck.txt
      - name: Addon unit tests (no Blender)
        env:
          PYTHON: .venv/bin/python
          TMPDIR: ${{ runner.temp }}
        run: npm run test:addon-unit
      - name: Addon typecheck with fake-bpy stubs
        run: npm run typecheck:addon

  coverage:
    name: Coverage ratchet
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PYTHONIOENCODING: utf-8
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22.17.0'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install dependencies
        run: |
          npm ci --legacy-peer-deps
          python -m pip install -r requirements-dev.txt
      - name: JS coverage
        run: npm run test:coverage
      - name: Python coverage
        env:
          PYTHON: python
          TMPDIR: ${{ runner.temp }}
        run: python -m pytest --cov=runtime --cov=addon --cov-report=xml:coverage/python-coverage.xml --cov-report=term
      - name: Upload coverage artifacts
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/
      - name: Diff coverage (changed lines)
        if: github.event_name == 'pull_request'
        run: |
          git fetch origin ${{ github.base_ref }} --depth=1
          diff-cover coverage/lcov.info --compare-branch=origin/${{ github.base_ref }} --fail-under=80
          diff-cover coverage/python-coverage.xml --compare-branch=origin/${{ github.base_ref }} --fail-under=80
