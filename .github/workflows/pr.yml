name: PR gate

on:
  pull_request:
  workflow_dispatch:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  static-and-tests:
    name: Static checks and PR tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PYTHONIOENCODING: utf-8
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.11'
          cache: pip
      - name: Install dependencies
        run: |
          npm ci --legacy-peer-deps
          python -m pip install -r requirements-dev.txt -r requirements-typecheck.txt
      - name: Typecheck
        run: npm run typecheck
      - name: Script typecheck
        run: npm run typecheck:scripts
      - name: Lint
        run: npm run lint
      - name: Format check
        run: npm run format:check
      - name: Structure and build checks
        run: |
          npm run build
          npm run check:structure
          npm run check:build
          npm run check:git-hygiene
      - name: Unit and integration tests
        run: |
          npm run test:unit
          npm run test:integration
          npm run test:contract
      - name: Python tests (no Blender)
        env:
          PYTHON: python
          TMPDIR: ${{ runner.temp }}
        run: npm run test:python
      - name: Behavior matrix release gate
        run: npm run test:matrix
      - name: Package dry run
        run: npm pack --dry-run

  addon:
    name: Blender addon unit tests and typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONIOENCODING: utf-8
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.11'
          cache: pip
      - name: Set up development environment
        run: node scripts/setup-dev.mjs
      - name: Addon unit tests (no Blender)
        env:
          PYTHON: .venv/bin/python
          TMPDIR: ${{ runner.temp }}
        run: npm run test:extension-unit
      - name: Addon typecheck with fake-bpy stubs
        run: npm run typecheck:extension
      - name: Python static gate
        env:
          PYTHON: .venv/bin/python
        run: npm run check:python-static

  extension:
    name: Blender extension package validation
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
      - name: Install dependencies
        run: npm ci --legacy-peer-deps
      - name: Build the addon package
        run: npm run build:extension
      - name: Cache Blender 4.2 LTS
        id: blender-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .cache/blender-4.2.10
          key: blender-4.2.10-linux-x64
      - name: Download Blender 4.2.10 LTS
        if: steps.blender-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p .cache
          curl -fsSL https://mirrors.ocf.berkeley.edu/blender/release/Blender4.2/blender-4.2.10-linux-x64.tar.xz -o /tmp/blender-4.2.10.tar.xz
          echo "7b888b36cf5bd7e35d495eb9717f7a9b645ea5f2fb4fe9850991800b8f08d531  /tmp/blender-4.2.10.tar.xz" | sha256sum -c -
          mkdir -p .cache/blender-4.2.10
          tar -xJf /tmp/blender-4.2.10.tar.xz -C .cache/blender-4.2.10 --strip-components=1
      - name: Record the validator version
        run: .cache/blender-4.2.10/blender --version | head -n 1
      - name: Reject an invalid extension package
        run: |
          printf 'not a blender extension\n' > /tmp/invalid-extension.zip
          if .cache/blender-4.2.10/blender --command extension validate /tmp/invalid-extension.zip; then
            echo "::error::the validator accepted an invalid package"
            exit 1
          fi
      - name: Validate the addon package
        run: .cache/blender-4.2.10/blender --command extension validate extension/dsh_blender_bridge.zip

  windows-helper:
    name: Windows hidden-desktop helper
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
      - name: Install dependencies
        run: npm ci --legacy-peer-deps
      - name: Build and self-test the helper
        run: npm run build:win-helper
      - name: Run the helper end-to-end checks
        run: node tests/e2e/win_hidden_desktop.mjs --json win-helper-e2e.json
      - name: Stage the helper as the packaged resource
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force vendor/win-hidden-desktop | Out-Null
          Copy-Item tools/win-hidden-desktop/out/dsh-blender-hidden-desktop.exe vendor/win-hidden-desktop/
          Copy-Item tools/win-hidden-desktop/out/build.json vendor/win-hidden-desktop/build.json
      - name: Verify the packaged helper and the tarball contents
        run: npm run check:win-helper -- --packed
      - name: Upload the helper end-to-end report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: win-hidden-desktop-e2e
          path: win-helper-e2e.json

  linux-preview-see:
    name: Linux preview virtual-gui and blender_see
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
      - name: Install dependencies
        run: npm ci --legacy-peer-deps
      - name: Install the Xvfb runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            xvfb libgl1 libegl1 libxkbcommon0 libxi6 libxxf86vm1 libxfixes3 \
            libxrender1 libsm6 libice6 libxrandr2 libxinerama1 libxcursor1 libgomp1
      - name: Cache Blender 4.2 LTS
        id: blender-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .cache/blender-4.2.10
          key: blender-4.2.10-linux-x64
      - name: Download Blender 4.2.10 LTS
        if: steps.blender-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p .cache
          curl -fsSL https://mirrors.ocf.berkeley.edu/blender/release/Blender4.2/blender-4.2.10-linux-x64.tar.xz -o /tmp/blender-4.2.10.tar.xz
          echo "7b888b36cf5bd7e35d495eb9717f7a9b645ea5f2fb4fe9850991800b8f08d531  /tmp/blender-4.2.10.tar.xz" | sha256sum -c -
          mkdir -p .cache/blender-4.2.10
          tar -xJf /tmp/blender-4.2.10.tar.xz -C .cache/blender-4.2.10 --strip-components=1
      - name: Run the Linux preview see end-to-end check
        env:
          TMPDIR: ${{ runner.temp }}
        run: node tests/e2e/linux_preview_see.mjs --blender "$PWD/.cache/blender-4.2.10/blender" --json linux-preview-see.json
      - name: Upload the Linux preview report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: linux-preview-see
          path: linux-preview-see.json

  coverage:
    name: Coverage ratchet
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PYTHONIOENCODING: utf-8
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.11'
          cache: pip
      - name: Install dependencies
        run: |
          npm ci --legacy-peer-deps
          python -m pip install -r requirements-dev.txt
      - name: JS coverage
        run: npm run test:coverage
      - name: Python coverage
        env:
          PYTHON: python
          TMPDIR: ${{ runner.temp }}
        run: |
          python -m pytest tests/unit/python tests/integration/python --cov=extension --cov-branch --cov-report=json:coverage/python-coverage.json --cov-report=term
      - name: Coverage ratchet gate
        env:
          COVERAGE_BASE_REF: v2.6.2
        run: |
          git rev-parse --verify "$COVERAGE_BASE_REF"
          diff-cover coverage/lcov.info --compare-branch="$COVERAGE_BASE_REF" --json-report=coverage/diff-cover.json
          npm run check:coverage
      - name: Upload coverage artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage
          path: coverage/
