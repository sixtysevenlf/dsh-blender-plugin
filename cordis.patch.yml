# @dsh-external/dsh-blender-plugin bundle 层（v0.9.2 起声明 `dsh.bundle`）。
#
# 为什么需要：0.1.7 起 DSH 用 @deepseek-ai/dsh-plugin-manager 管理 profile 插件，判定依据就是
# package.json 的 `dsh.bundle`；没有它的包会被写成 "installed as a plain dependency, not a
# profile layer"，不能以 bundle 方式安装/切换。本包此前只能靠 dsh-super-injector 运行时注入
# ——注入器一坏，15 个工具会**整体消失**（而 Blender 与插件包都没坏），故障现象与真因不在同一层。
#
# 两种装配方式二选一（不能同时用，否则两个 fiber 会重复注册同名工具）：
#   A. 注入式（现状）：dsh-super-injector 的 registry.json 记住本包，启动时自动注入；
#   B. bundle 式（本文件）：profile 的 dsh.profile.bundles 里加入本包，装配时插入下面这行。
# 切换步骤与回滚见 docs/DSH-更新适配.md。
- insert:
    - id: dsh-blender-plugin
      name: '@dsh-external/dsh-blender-plugin'
      config: {}
