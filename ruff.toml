# Editor-facing Ruff baseline for the legacy Blender addon. This is not a CI gate;
# the four groups below catch syntax / undefined-name mistakes, which are the
# findings that make an open file look broken. Broad style and unused-import
# rules are deliberately not enabled yet: the addon still carries known legacy
# re-export/formatting debt, and showing it as hundreds of squiggles hides the
# errors that matter. Expand this set as that debt is paid down.
target-version = "py311"
line-length = 120

[lint]
select = ["E9", "F63", "F7", "F82"]
